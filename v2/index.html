/* ---------- Rendering ---------- */

const homeView = document.getElementById("home-view");
const projectView = document.getElementById("project-view");
const processList = document.getElementById("process-list");
const pageTitle = document.getElementById("page-title");
const backBtn = document.getElementById("back-btn");
const projectDescription = document.getElementById("project-description");
const projectTools = document.getElementById("project-tools");
const stepGroups = document.getElementById("step-groups");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxClose = document.getElementById("lightbox-close");
const progress = document.getElementById("progress");
const progressCount = document.getElementById("progress-count");
const progressFill = document.getElementById("progress-fill");
const completeModal = document.getElementById("complete-modal");
const completeClose = document.getElementById("complete-close");

backBtn.innerHTML = icons.arrowLeft;
lightboxClose.innerHTML = icons.close;
document.getElementById("complete-modal-badge").innerHTML = icons.check;

/* ---------- Progress (linear step flow) ----------
   Following the Neo-Brutalist design system: a process is a linear sequence.
   State is a single "steps completed" count per process, held only in memory
   (`progressState`) — it is intentionally NOT persisted, so it resets whenever the
   app is closed or reloaded; there is no manual reset. From the count each step
   derives a status: index < done → done, index === done → current, index > done →
   locked. You advance one step at a time with "Merkitse valmiiksi". */

const progressState = {}; // { [processId]: <doneCount> } — in-memory, cleared on reload
let currentProcessId = null;

function processTotal(process) {
  return process.groups.reduce((sum, g) => sum + g.tasks.length, 0);
}
/* Completed-step count for a process, clamped to a valid range. */
function getDone(id, process) {
  const raw = progressState[id];
  const total = process ? processTotal(process) : Infinity;
  if (typeof raw !== "number" || raw < 0) return 0;
  return Math.min(raw, total);
}
function setDone(id, n) {
  if (n > 0) progressState[id] = n; else delete progressState[id];
}

function renderHome() {
  processList.innerHTML = Object.entries(processes).map(([id, process]) => {
    const total = processTotal(process);
    const done = getDone(id, process);
    const complete = total > 0 && done === total;
    return `
    <button class="card-project" data-process="${id}">
      <span class="card-project__title">${process.title}</span>
      <span class="card-project__count${complete ? " is-complete" : ""}">${done}/${total}</span>
      ${icons.chevronRight}
    </button>
  `;
  }).join("");
}

/* One step card. `status` is "done" | "current" | "locked".
   Done + current show their body; locked shows only the title row (dimmed).
   The current step carries the flow controls (back + mark complete). */
function renderTask(task, num, total, status) {
  const hasPhotos = task.photos && task.photos.length > 0;
  const showBody = status === "done" || status === "current";
  /* The tag is no longer shown for done/current — the badge and the open body
     already say which is which — but it stays in the DOM for screen readers.
     Locked steps show a padlock instead of the word. */
  const tagText = status === "done" ? "Valmis" : status === "current" ? "Kesken" : "Lukittu";
  const tag = status === "locked"
    ? `<span class="card-task__tag">${icons.lock}</span>`
    : `<span class="card-task__tag sr-only">${tagText}</span>`;
  const rewindable = status === "done";
  const headTag = rewindable ? "button" : "div";
  const headAttrs = rewindable
    ? ` type="button" data-rewind="${num}" title="Palaa tähän vaiheeseen"`
    : "";

  const body = showBody ? `
      <div class="card-task__body">
        ${task.detail ? `
          <div>
            <p class="card-task__section-label">Ohjeet</p>
            <p class="card-task__section-text">${task.detail}</p>
          </div>
        ` : ""}
        ${task.tools ? `
          <div>
            <p class="card-task__section-label">Työkalut</p>
            <p class="card-task__section-text">${task.tools}</p>
          </div>
        ` : ""}
        ${hasPhotos ? `
          <div>
            <p class="card-task__section-label">Liitteet</p>
            <div class="attachments-grid">
              ${task.photos.flatMap(ref => {
                const val = PHOTOS[ref] || ref;
                return Array.isArray(val) ? val : [val];
              }).map((src, i) => `
                <button class="attachment-thumb" data-photo="${src}" aria-label="Avaa kuva ${i + 1}">
                  <img src="${src}" alt="${ALT[src] || ""}" loading="lazy">
                </button>`).join("")}
            </div>
          </div>
        ` : ""}
        ${task.warning ? `
          <div class="alert-box">
            ${icons.warning}
            <div>
              <p class="alert-box__title">Huomio</p>
              <p class="alert-box__text">${task.warning}</p>
            </div>
          </div>
        ` : ""}
        ${status === "current" ? `
          <div class="step-actions">
            <button type="button" class="btn-complete" data-complete>Merkitse valmiiksi</button>
          </div>
        ` : ""}
      </div>` : "";

  return `
    <div class="card-task is-${status}" data-step="${num}">
      <${headTag} class="card-task__head"${headAttrs}>
        <span class="task-badge">
          <span class="task-badge__num">${num}</span>
          ${icons.check}
        </span>
        <span class="card-task__titlerow">
          <span class="card-task__title">${task.title}</span>
          ${tag}
        </span>
      </${headTag}>
      ${body}
    </div>
  `;
}

function renderProject(id) {
  const process = processes[id];
  const total = processTotal(process);
  const done = getDone(id, process);
  projectDescription.textContent = process.description;
  const hasTools = process.tools && process.tools.length > 0;
  projectTools.innerHTML = hasTools ? `
    <p class="page-tools__label">Tarvittavat työkalut</p>
    ${process.tools.map(t => `<p class="page-tools__row">${t.cabin}: ${t.items}.</p>`).join("")}
  ` : "";
  projectTools.hidden = !hasTools;

  let num = 0;
  stepGroups.innerHTML = process.groups.map(group => `
    <div class="step-group">
      <div class="step-group__header">
        <h2 class="step-group__label">${group.label}</h2>
        ${group.name ? `<p class="step-group__name">${group.name}</p>` : ""}
      </div>
      <div class="task-list">
        ${group.tasks.map(task => {
          num++;
          const status = num - 1 < done ? "done" : (num - 1 === done ? "current" : "locked");
          return renderTask(task, num, total, status);
        }).join("")}
      </div>
    </div>
  `).join("");

  progressCount.textContent = done + "/" + total;
  progressFill.style.width = total ? (done / total * 100) + "%" : "0%";
  progress.classList.toggle("is-complete", total > 0 && done === total);
}

/* Move the completed-step count by delta (advance or step back) and re-render,
   keeping the (new) current step in view. */
function stepBy(delta) {
  if (!currentProcessId) return;
  const process = processes[currentProcessId];
  const total = processTotal(process);
  const next = Math.min(Math.max(getDone(currentProcessId, process) + delta, 0), total);
  setDone(currentProcessId, next);
  renderProject(currentProcessId);
  if (delta > 0 && total > 0 && next === total) {
    openCompleteModal();
  } else {
    scrollToCurrent();
  }
}

/* Completion modal — shown when the final step is marked done. Closing it resets
   the process back to the start (progress is a one-shot run, not a saved record).
   Focus moves into the modal on open and returns to the step list on close; while
   open, focus is kept on the close button (single-control focus trap). */
function openCompleteModal() {
  completeModal.hidden = false;
  completeClose.focus();
}
function closeCompleteModal() {
  completeModal.hidden = true;
  if (currentProcessId) {
    setDone(currentProcessId, 0);
    renderProject(currentProcessId);
    projectView.scrollTop = 0;
    window.scrollTo(0, 0);
    // Return focus to something real in the (re-rendered) list.
    const next = stepGroups.querySelector("[data-complete]") || backBtn;
    if (next) next.focus();
  }
}
function setDoneAndRender(n) {
  if (!currentProcessId) return;
  const total = processTotal(processes[currentProcessId]);
  setDone(currentProcessId, Math.min(Math.max(n, 0), total));
  renderProject(currentProcessId);
  scrollToCurrent();
}
function scrollToCurrent() {
  const cur = stepGroups.querySelector(".card-task.is-current");
  if (!cur) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  cur.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
}

function showHome() {
  currentProcessId = null;
  renderHome(); // refresh the per-process done/total counts
  homeView.hidden = false;
  projectView.hidden = true;
  backBtn.hidden = true;
  pageTitle.textContent = "Mökin vedet";
}

function showProject(id) {
  currentProcessId = id;
  renderProject(id);
  homeView.hidden = true;
  projectView.hidden = false;
  backBtn.hidden = false;
  pageTitle.textContent = processes[id].title;
  projectView.scrollTop = 0;
  window.scrollTo(0, 0);
}

function openLightbox(src) {
  lightboxImg.src = src;
  lightboxImg.alt = ALT[src] || "";
  lightbox.hidden = false;
}

function closeLightbox() {
  lightbox.hidden = true;
  lightboxImg.src = "";
  lightboxImg.alt = "";
}

/* ---------- Events ---------- */

processList.addEventListener("click", (e) => {
  const card = e.target.closest(".card-project");
  if (card) showProject(card.dataset.process);
});

backBtn.addEventListener("click", showHome);

stepGroups.addEventListener("click", (e) => {
  if (e.target.closest("[data-complete]")) { stepBy(1); return; }
  const rewind = e.target.closest("[data-rewind]");
  if (rewind) { setDoneAndRender(Number(rewind.dataset.rewind) - 1); return; }
  const thumb = e.target.closest(".attachment-thumb");
  if (thumb) openLightbox(thumb.dataset.photo);
});

lightboxClose.addEventListener("click", closeLightbox);
lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) closeLightbox();
});

completeClose.addEventListener("click", closeCompleteModal);
completeModal.addEventListener("click", (e) => {
  if (e.target === completeModal) closeCompleteModal();
});

document.addEventListener("keydown", (e) => {
  // While the completion modal is open, keep focus on its only control.
  if (!completeModal.hidden && e.key === "Tab") {
    e.preventDefault();
    completeClose.focus();
    return;
  }
  if (e.key !== "Escape") return;
  if (!completeModal.hidden) closeCompleteModal();
  else if (!lightbox.hidden) closeLightbox();
});

renderHome();
showHome();
</script>
